<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Tecla Viva</title>
<meta name="description" content="Aprenda piano com notas caindo: Wait Mode, loop, andamento, mãos separadas, microfone e MIDI.">
<meta name="theme-color" content="#0d111e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Figtree:wght@400;600;700;800&display=swap">
<style>/* Tecla Viva — sala de estudo à noite: fundo tinta-azul, mão direita âmbar, mão esquerda azul,
   acerto verde-água. Tema escuro único, de propósito: as notas precisam de contraste máximo. */
:root {
  --ink-0: #0d111e;
  --ink-1: #141a2b;
  --ink-2: #1c2338;
  --ink-3: #262f4a;
  --line: #2e3858;
  --text: #eef0f7;
  --muted: #98a1bf;
  --faint: #6a7394;
  --rh: #ff8a4c;
  --rh-soft: #ffb98f;
  --lh: #5f8cff;
  --lh-soft: #a9c0ff;
  --hit: #3fe0c4;
  --miss: #ff5c72;
  --gold: #ffc857;
  --ivory: #f3efe6;
  --font-display: 'Bricolage Grotesque', 'Avenir Next', 'Segoe UI', system-ui, sans-serif;
  --font-body: 'Figtree', 'Segoe UI', system-ui, -apple-system, sans-serif;
  --r-s: 8px;
  --r-m: 14px;
  --r-l: 22px;
  --gutter-l: max(16px, env(safe-area-inset-left, 0px));
  --gutter-r: max(16px, env(safe-area-inset-right, 0px));
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--ink-0);
  color: var(--text);
  font: 15px/1.45 var(--font-body);
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
  overscroll-behavior: none;
}
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--hit); outline-offset: 2px; border-radius: 6px; }
h1, h2, h3 { font-family: var(--font-display); text-wrap: balance; margin: 0; letter-spacing: -0.01em; }
.num { font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.eyebrow { font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); font-weight: 600; }

#app { min-height: 100%; }
.page {
  max-width: 1100px;
  margin: 0 auto;
  padding-left: var(--gutter-l);
  padding-right: var(--gutter-r);
  padding-block: 12px 48px;
  display: flex;
  flex-direction: column;
  gap: 22px;
}

/* ---------- cabeçalho */
.topbar {
  display: flex;
  align-items: center;
  gap: 12px;
  padding-block: 8px;
  position: sticky;
  top: env(safe-area-inset-top, 0px);
  z-index: 5;
  background: linear-gradient(var(--ink-0) 75%, transparent);
}
body::before { content: ''; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--ink-0); }
.brand { display: flex; align-items: center; gap: 10px; font-family: var(--font-display); font-weight: 800; font-size: 21px; letter-spacing: -0.02em; }
.brand svg { flex: none; }
.spacer { flex: 1; }
.icon-btn {
  width: 40px; height: 40px; border-radius: 12px; border: 1px solid var(--line);
  background: var(--ink-1); display: grid; place-items: center; padding: 0;
}
.icon-btn:hover { background: var(--ink-2); }
.icon-btn svg { width: 20px; height: 20px; }
.chip-stat {
  display: inline-flex; align-items: center; gap: 6px; height: 36px; padding: 0 12px;
  border-radius: 999px; background: var(--ink-1); border: 1px solid var(--line); font-weight: 700;
}
.chip-stat svg { width: 18px; height: 18px; }

/* ---------- meta da semana */
.goal { display: flex; align-items: center; gap: 14px; padding: 14px 16px; border-radius: var(--r-m); background: var(--ink-1); border: 1px solid var(--line); flex-wrap: wrap; }
.goal-text { flex: 1 1 200px; min-width: 0; }
.goal-text strong { font-family: var(--font-display); font-size: 17px; }
.week { display: flex; gap: 6px; }
.day { width: 30px; display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 11px; color: var(--faint); font-weight: 600; }
.day i { width: 26px; height: 26px; border-radius: 50%; border: 2px solid var(--ink-3); display: grid; place-items: center; font-style: normal; }
.day.met i { background: var(--gold); border-color: var(--gold); color: var(--ink-0); }
.day.today { color: var(--text); }
.day.today i { border-color: var(--muted); }
.day.partial i { border-color: var(--gold); border-style: dashed; }

/* ---------- busca e filtros */
.search { position: relative; }
.search input {
  width: 100%; height: 46px; border-radius: 14px; border: 1px solid var(--line); background: var(--ink-1);
  padding: 0 14px 0 42px; outline: none;
}
.search input:focus { border-color: var(--muted); }
.search svg { position: absolute; left: 14px; top: 13px; width: 20px; height: 20px; color: var(--muted); }
.chips { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
.chips::-webkit-scrollbar { display: none; }
.chip {
  flex: none; height: 34px; padding: 0 14px; border-radius: 999px; border: 1px solid var(--line);
  background: transparent; color: var(--muted); font-weight: 600; font-size: 14px;
}
.chip[aria-pressed='true'] { background: var(--text); color: var(--ink-0); border-color: var(--text); }

/* ---------- prateleiras de músicas */
.shelf { display: flex; flex-direction: column; gap: 12px; }
.shelf-head { display: flex; align-items: baseline; gap: 10px; }
.shelf-head h2 { font-size: 20px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 14px; }
.row-scroll { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(150px, 170px); gap: 14px; overflow-x: auto; scrollbar-width: none; padding-bottom: 4px; }
.row-scroll::-webkit-scrollbar { display: none; }
.card {
  display: flex; flex-direction: column; gap: 8px; text-align: left; padding: 0; border: 0; background: none; min-width: 0;
}
.cover { position: relative; width: 100%; aspect-ratio: 1; max-width: 100%; border-radius: var(--r-m); overflow: hidden; background: var(--ink-2); }
.cover canvas { width: 100%; height: 100%; display: block; }
.cover .fav { position: absolute; top: 8px; right: 8px; width: 22px; height: 22px; color: var(--miss); filter: drop-shadow(0 1px 2px #0008); }
.cover .stars { position: absolute; left: 8px; bottom: 8px; display: flex; gap: 1px; }
.cover .stars svg { width: 15px; height: 15px; }
.card:hover .cover { outline: 2px solid var(--line); }
.card-title { font-weight: 700; line-height: 1.25; }
.card-sub { font-size: 13px; color: var(--muted); line-height: 1.3; }
.empty { padding: 28px 16px; border: 1px dashed var(--line); border-radius: var(--r-m); color: var(--muted); text-align: center; }

/* ---------- botões */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 48px; padding: 0 22px;
  border-radius: 14px; border: 1px solid var(--line); background: var(--ink-2); font-weight: 700;
}
.btn:hover { background: var(--ink-3); }
.btn svg { width: 20px; height: 20px; }
.btn.primary { background: var(--rh); border-color: var(--rh); color: #1b0d04; }
.btn.primary:hover { background: #ff9b64; }
.btn.ghost { background: transparent; }
.btn.small { height: 38px; padding: 0 14px; font-size: 14px; border-radius: 11px; }
.btn[disabled] { opacity: 0.45; cursor: not-allowed; }

/* ---------- tela da música */
.song-hero { display: grid; grid-template-columns: minmax(0, 300px) minmax(0, 1fr); gap: 28px; align-items: start; }
@media (max-width: 720px) { .song-hero { grid-template-columns: minmax(0, 1fr); gap: 18px; } .song-hero .cover { max-width: 260px; } }
.song-info { display: flex; flex-direction: column; gap: 18px; min-width: 0; }
.tag { display: inline-flex; width: fit-content; padding: 3px 10px; border-radius: 999px; background: var(--ink-2); color: var(--lh-soft); font-size: 13px; font-weight: 700; }
.song-title { font-size: clamp(28px, 5vw, 44px); line-height: 1.05; }
.facts { display: flex; flex-wrap: wrap; gap: 6px 18px; color: var(--muted); font-size: 14px; }
.facts b { color: var(--text); font-weight: 700; }
.hands { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.hand-btn {
  display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 14px 10px 12px; border-radius: var(--r-m);
  border: 1px solid var(--line); background: var(--ink-1); min-width: 0;
}
.hand-btn:hover { background: var(--ink-2); }
.hand-btn .hand-name { font-size: 13px; color: var(--muted); font-weight: 600; }
.hand-btn .level { font-family: var(--font-display); font-weight: 700; font-size: 17px; }
.hand-btn svg.hand { width: 44px; height: 44px; }
.hand-btn.off { opacity: 0.55; }
.meter { display: flex; gap: 4px; }
.meter i { width: 22px; height: 5px; border-radius: 3px; background: var(--ink-3); }
.hand-btn[data-hand='R'] .meter i.on { background: var(--rh); }
.hand-btn[data-hand='L'] .meter i.on { background: var(--lh); }
.hint { font-size: 13px; color: var(--faint); }
.tabs { display: inline-flex; padding: 4px; border-radius: 13px; background: var(--ink-1); border: 1px solid var(--line); width: fit-content; }
.tabs button { height: 36px; padding: 0 16px; border-radius: 10px; border: 0; background: none; color: var(--muted); font-weight: 700; }
.tabs button[aria-selected='true'] { background: var(--ink-3); color: var(--text); }
.actions { display: flex; gap: 10px; flex-wrap: wrap; }
.toggles { display: flex; flex-direction: column; border: 1px solid var(--line); border-radius: var(--r-m); background: var(--ink-1); }
.toggle-row { display: flex; align-items: center; gap: 12px; padding: 12px 14px; min-height: 56px; }
.toggle-row + .toggle-row { border-top: 1px solid var(--line); }
.toggle-row .lbl { flex: 1; min-width: 0; }
.toggle-row .lbl small { display: block; color: var(--muted); font-size: 13px; }
.switch { position: relative; width: 46px; height: 28px; flex: none; }
.switch input { position: absolute; inset: 0; opacity: 0; margin: 0; cursor: pointer; }
.switch span { position: absolute; inset: 0; border-radius: 999px; background: var(--ink-3); transition: background 0.15s; pointer-events: none; }
.switch span::after { content: ''; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%; background: var(--muted); transition: transform 0.15s, background 0.15s; }
.switch input:checked + span { background: var(--hit); }
.switch input:checked + span::after { transform: translateX(18px); background: var(--ink-0); }
.switch input:focus-visible + span { outline: 2px solid var(--hit); outline-offset: 2px; }
.stepper { display: flex; align-items: center; gap: 4px; }
.stepper button { width: 36px; height: 36px; border-radius: 10px; border: 1px solid var(--line); background: var(--ink-2); font-size: 18px; font-weight: 700; padding: 0; }
.stepper output { min-width: 56px; text-align: center; font-weight: 800; font-variant-numeric: tabular-nums; }
select.select { height: 38px; border-radius: 10px; border: 1px solid var(--line); background: var(--ink-2); padding: 0 10px; max-width: 100%; }
input[type='range'] { accent-color: var(--hit); width: 140px; max-width: 100%; }

/* ---------- caminho passo a passo */
.path { display: flex; flex-direction: column; gap: 0; border: 1px solid var(--line); border-radius: var(--r-m); background: var(--ink-1); overflow: hidden; }
.step { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border: 0; background: none; text-align: left; width: 100%; }
.step + .step { border-top: 1px solid var(--line); }
.step .dot { width: 30px; height: 30px; flex: none; border-radius: 50%; display: grid; place-items: center; border: 2px solid var(--ink-3); color: var(--faint); font-size: 13px; font-weight: 800; }
.step.done .dot { background: var(--hit); border-color: var(--hit); color: var(--ink-0); }
.step.next .dot { border-color: var(--rh); color: var(--rh); }
.step.locked { opacity: 0.5; cursor: default; }
.step .txt { flex: 1; min-width: 0; }
.step .txt b { display: block; font-weight: 700; }
.step .txt small { color: var(--muted); font-size: 13px; }
.step.next { background: var(--ink-2); }

/* ---------- tela de tocar */
.player { position: fixed; inset: 0; background: var(--ink-0); overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none; }
.player canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.hud {
  position: absolute; left: 0; right: 0; top: 0; display: flex; align-items: center; gap: 10px;
  padding: calc(env(safe-area-inset-top, 0px) + 8px) calc(env(safe-area-inset-right, 0px) + 10px) 8px calc(env(safe-area-inset-left, 0px) + 10px);
  background: linear-gradient(#0d111ef2 55%, #0d111e00);
  pointer-events: none;
}
.hud > * { pointer-events: auto; }
.hud .icon-btn { background: #141a2bcc; backdrop-filter: blur(6px); }
.progress { flex: 1; min-width: 60px; height: 34px; position: relative; cursor: pointer; touch-action: none; }
.progress .track { position: absolute; left: 0; right: 0; top: 15px; height: 4px; border-radius: 2px; background: repeating-linear-gradient(90deg, var(--ink-3) 0 3px, transparent 3px 7px); }
.progress .fill { position: absolute; left: 0; top: 15px; height: 4px; border-radius: 2px; background: var(--text); }
.progress .loop { position: absolute; top: 9px; height: 16px; border-radius: 5px; background: #3fe0c42e; border: 1px solid var(--hit); }
.progress .head { position: absolute; top: 10px; width: 14px; height: 14px; margin-left: -7px; border-radius: 50%; background: var(--text); box-shadow: 0 0 0 3px #0d111e; }
.progress .tick { position: absolute; top: 12px; width: 1px; height: 10px; background: var(--line); }
.hud-title { font-weight: 700; font-size: 14px; max-width: 28vw; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
@media (max-width: 560px) { .hud-title { display: none; } }
.pill { display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 10px; border-radius: 999px; background: #141a2bcc; border: 1px solid var(--line); font-size: 13px; font-weight: 700; white-space: nowrap; }
.pill.on { border-color: var(--hit); color: var(--hit); }
.level-meter { width: 34px; height: 6px; border-radius: 3px; background: var(--ink-3); overflow: hidden; }
.level-meter i { display: block; height: 100%; background: var(--hit); width: 0; }
.center-msg {
  position: absolute; left: 50%; top: 38%; transform: translate(-50%, -50%); text-align: center; pointer-events: none;
  font-family: var(--font-display); font-weight: 800; text-shadow: 0 2px 18px #000a;
}
.center-msg .big { font-size: clamp(48px, 12vw, 96px); line-height: 1; }
.center-msg .small { font-size: 18px; color: var(--muted); font-family: var(--font-body); font-weight: 600; margin-top: 8px; }
.feedback { position: absolute; top: calc(env(safe-area-inset-top, 0px) + 58px); left: 50%; transform: translateX(-50%); font-weight: 800; font-size: 15px; pointer-events: none; letter-spacing: 0.02em; }
.toast { position: absolute; left: 50%; bottom: 30%; transform: translateX(-50%); padding: 10px 16px; border-radius: 12px; background: #141a2bf0; border: 1px solid var(--line); font-weight: 700; pointer-events: none; text-align: center; max-width: min(90vw, 420px); }
.sheet-wrap { position: absolute; inset: 0; background: #05070d99; display: flex; align-items: flex-end; justify-content: center; z-index: 20; }
.sheet {
  width: min(560px, 100%); max-height: 86%; overflow-y: auto; background: var(--ink-1); border: 1px solid var(--line); border-bottom: 0;
  border-radius: var(--r-l) var(--r-l) 0 0; padding: 18px var(--gutter-r) calc(env(safe-area-inset-bottom, 0px) + 18px) var(--gutter-l);
  display: flex; flex-direction: column; gap: 14px;
}
.sheet h3 { font-size: 19px; }
.sheet .row2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.seg { display: flex; gap: 6px; flex-wrap: wrap; }
.seg button { height: 34px; padding: 0 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--ink-2); font-size: 13px; font-weight: 700; color: var(--muted); }
.seg button[aria-pressed='true'] { border-color: var(--text); color: var(--text); background: var(--ink-3); }
.rotate-hint { position: absolute; left: 50%; top: 45%; transform: translate(-50%, -50%); text-align: center; color: var(--muted); font-size: 14px; pointer-events: none; display: none; }
@media (orientation: portrait) and (max-width: 600px) { .rotate-hint { display: block; } }

/* ---------- resultado */
.result { display: flex; flex-direction: column; gap: 22px; align-items: stretch; max-width: 720px; width: 100%; margin: 0 auto; }
.result-head { display: flex; flex-direction: column; align-items: center; gap: 10px; text-align: center; padding-top: 10px; }
.result-stars { display: flex; gap: 6px; }
.result-stars svg { width: 46px; height: 46px; }
.score-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 12px; }
.score { padding: 16px; border-radius: var(--r-m); background: var(--ink-1); border: 1px solid var(--line); display: flex; flex-direction: column; gap: 2px; }
.score .v { font-family: var(--font-display); font-weight: 800; font-size: 34px; line-height: 1.1; font-variant-numeric: tabular-nums; }
.score .k { color: var(--muted); font-size: 13px; font-weight: 600; }
.heat { display: flex; gap: 3px; align-items: flex-end; height: 64px; padding: 10px 12px; border-radius: var(--r-m); background: var(--ink-1); border: 1px solid var(--line); overflow-x: auto; }
.heat i { flex: 1 0 10px; min-width: 8px; border-radius: 3px 3px 1px 1px; }
.heat-legend { display: flex; justify-content: space-between; font-size: 12px; color: var(--faint); }
.counts { display: flex; flex-wrap: wrap; gap: 8px 20px; color: var(--muted); }
.counts b { color: var(--text); }
.callout { padding: 14px 16px; border-radius: var(--r-m); border: 1px solid var(--rh); background: #ff8a4c14; display: flex; gap: 14px; align-items: center; flex-wrap: wrap; }
.callout .txt { flex: 1 1 220px; min-width: 0; }
.callout b { display: block; }

/* ---------- importação e ajustes */
.panel { padding: 16px; border-radius: var(--r-m); background: var(--ink-1); border: 1px solid var(--line); display: flex; flex-direction: column; gap: 14px; }
.drop { border: 2px dashed var(--line); border-radius: var(--r-m); padding: 28px 16px; text-align: center; display: flex; flex-direction: column; gap: 10px; align-items: center; }
.drop.over { border-color: var(--hit); background: #3fe0c40d; }
.part-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 10px 0; border-top: 1px solid var(--line); }
.part-row:first-child { border-top: 0; }
.part-row b { display: block; overflow-wrap: anywhere; }
.part-row small { color: var(--muted); }
.field { display: flex; flex-direction: column; gap: 6px; }
.field input[type='text'] { height: 44px; border-radius: 12px; border: 1px solid var(--line); background: var(--ink-2); padding: 0 12px; }
.error { color: var(--miss); font-weight: 600; }
.mic-test { display: flex; flex-direction: column; gap: 10px; }
.mic-note { font-family: var(--font-display); font-size: 40px; font-weight: 800; min-height: 52px; color: var(--hit); }
.bar { height: 8px; border-radius: 4px; background: var(--ink-3); overflow: hidden; }
.bar i { display: block; height: 100%; width: 0; background: var(--hit); transition: width 0.06s linear; }

@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; animation: none !important; }
}
</style>
</head>
